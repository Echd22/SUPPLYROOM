name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Android SDK location
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Load signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Signing key secret is missing. Building a test APK only; no release will be published."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Put the important lines into one annotation so they're visible without the raw log.
          msg=$(grep -E "^e: |error:|What went wrong|Could not|> " build.log 2>/dev/null | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -z "$msg" ] && msg=$(tail -40 build.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:-no build.log}"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SupplyRoom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SupplyRoom-apk
          path: SupplyRoom.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SupplyRoom.apk \
            --title "Supply Room 1.0.${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}" \
            --latest
